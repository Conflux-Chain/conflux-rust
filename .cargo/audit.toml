[advisories]
ignore = [
    # tracing-subscriber 0.2.25 is an optional dep of ark-relations 0.5.x,
    # reached only via revm-precompile -> ark-bn254 -> ark-r1cs-std ->
    # ark-relations. ark-relations 0.6 moved to tracing-subscriber 0.3, but the
    # current revm-precompile 31.x stack still requires arkworks 0.5.
    # revm-precompile 43.0.3 uses arkworks 0.6, but adopting it requires a
    # coordinated revm upgrade. cargo-deny's resolved graph omits this edge;
    # only the raw-lockfile cargo-audit scan flags it, hence audit-only.
    "RUSTSEC-2025-0055",
    # Same scoped crypto-bigint exception and removal conditions as deny.toml.
    # The audited node paths verify/recover public inputs; Conflux secp256k1
    # signing and ECDH use libsecp256k1. Reassess before adding secret-input
    # RustCrypto operations.
    "RUSTSEC-2026-0387",
]
